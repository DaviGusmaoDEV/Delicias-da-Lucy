<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delícias da Lucy | Entrar</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-container"><form id="form-login" class="card-login">
    <a href="/login-cliente" class="logo">Delicias<span> Da Lucy</span></a>
    <h1>Entrar para fazer pedido</h1><p class="ajuda-campo">Use seu e-mail e senha cadastrados.</p>
    <div class="form-group"><label for="email">E-mail</label><input type="email" id="email" class="form-control" autocomplete="email" required></div>
    <div class="form-group"><label for="senha">Senha</label><input type="password" id="senha" class="form-control" autocomplete="current-password" required></div>
    <button type="submit" class="btn btn-primary">Entrar</button>
    <p class="login-footer">Ainda não tem cadastro? <a href="/cadastro-cliente">Cadastrar como cliente</a></p>
    <p class="login-footer"><a href="/login">Sou administrador</a></p>
  </form></main>
</body>
</html>
