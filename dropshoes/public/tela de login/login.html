<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias Da Lucy | Login Administrativo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="../js/login.js" defer></script>
</head>
<body class="login-page">
    <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo principal</a>

    <main class="login-container" id="conteudo-principal" tabindex="-1">
        <form id="form-login" data-acesso="admin" class="card-login">
            <a href="../tela de login/login cliente.html" class="logo">Delicias<span> Da Lucy</span></a>
            <h1>Acesso administrativo</h1>

            <div class="form-group">
                <label for="identificador">E-mail ou telefone administrativo</label>
                <div class="input-with-icon">
                    <span class="material-symbols-outlined" aria-hidden="true">badge</span>
                    <input type="text" id="identificador" autocomplete="username" class="form-control" placeholder="E-mail ou telefone administrativo" required>
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="input-with-icon">
                    <span class="material-symbols-outlined" aria-hidden="true">lock</span>
                    <input type="password" id="senha" autocomplete="current-password" class="form-control" placeholder="Senha" required>
                    <button type="button" class="btn-mostrar-senha" data-mostrar-senha aria-controls="senha" aria-pressed="false">Mostrar senha</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" data-loading-label="Entrando...">Entrar no painel</button>

            <p class="login-footer">
                Acesso exclusivo para administradores já cadastrados.<br><a href="../tela de login/login cliente.html">Entrar como cliente</a>
            </p>
        </form>
    </main>

</body>
</html>
