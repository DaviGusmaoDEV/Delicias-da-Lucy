<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias Da Lucy | Login Administrativo</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="/js/login.js" defer></script>
</head>
<body class="login-page">

    <div class="login-container">
        <form id="form-login" data-acesso="admin" class="card-login">
            <a href="/login-cliente" class="logo">Delicias<span> Da Lucy</span></a>
            <h2>Acessar Conta Administrativa</h2>

            <div class="form-group">
                <div class="input-with-icon">
                    <span class="material-symbols-outlined">badge</span>
                    <input type="email" id="email" autocomplete="email" class="form-control" placeholder="E-mail administrativo" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-with-icon">
                    <span class="material-symbols-outlined">lock</span>
                    <input type="password" id="senha" autocomplete="current-password" class="form-control" placeholder="Senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Entrar</button>

            <p class="login-footer">
                Acesso exclusivo para administradores já cadastrados.<br><a href="/login-cliente">Entrar como cliente</a>
            </p>
        </form>
    </div>

</body>
</html>
