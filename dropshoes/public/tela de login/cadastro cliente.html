<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias Da Lucy | Cadastro de Cliente</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="../js/cadastro.js" defer></script>
</head>
<body class="login-page">
    <div class="login-container">
        <form id="form-cadastro-cliente" class="card-login">
            <a href="../tela de login/login cliente.html" class="logo">Delicias<span> Da Lucy</span></a>
            <h2>Cadastro de Cliente</h2>

            <div class="form-group">
                <div class="input-with-icon">
                    <span class="material-symbols-outlined">badge</span>
                    <input type="text" id="nome" name="nome" autocomplete="name" minlength="2" maxlength="100" aria-label="Nome completo" class="form-control" placeholder="Nome Completo" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-with-icon">
                    <span class="material-symbols-outlined">mail</span>
                    <input type="email" id="email" name="email" autocomplete="email" maxlength="254" aria-label="E-mail" class="form-control" placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-with-icon">
                    <span class="material-symbols-outlined">headphones</span>
                    <input type="tel" id="telefoneCliente" name="telefone" autocomplete="tel" maxlength="30" aria-label="Telefone (opcional)" class="form-control" placeholder="(16) 9999-9999">
                </div>
            </div>

            <div class="form-group">
                <div class="input-with-icon">
                    <span class="material-symbols-outlined">lock</span>
                    <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8" maxlength="128" aria-label="Senha (mínimo de 8 caracteres)" class="form-control" placeholder="Senha (mínimo de 8 caracteres)" required>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmarSenha">Confirme sua senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" class="form-control" autocomplete="new-password" minlength="8" maxlength="128" required>
            </div>
            <button type="submit" class="btn btn-primary">Finalizar Cadastro</button>
            <a href="../tela de login/login cliente.html"><p style="text-align: center; margin-top: 15px;">Já possui cadastro? Faça o login</p></a>
        </form>
    </div>
</body>
</html>
