<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias Da Lucy | Catálogo de Produtos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/vendor/sweetalert2.js"></script>
    <script type="module" src="../js/produtos.js" defer></script>
    <script type="module" src="../js/sessao.js" defer></script>
</head>
<body data-acesso="cliente" data-publica>

    <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="../tela cliente/principal.html" class="logo">Delicias<span> Da Lucy</span></a>
        <h2>Painel de Navegação</h2>
    </div>

    <nav class="sidebar-nav">
        <a href="../tela cliente/principal.html" class="nav-item"><span class="material-symbols-outlined">home</span> Início</a>
        <a href="../tela cliente/Produtos.html" class="nav-item active"><span class="material-symbols-outlined">inventory_2</span> Cardápio</a>
        <a href="../tela cliente/meu perfil cliente.html" class="nav-item"><span class="material-symbols-outlined">person</span> Meu Perfil</a>
        <a href="../tela cliente/carrino cliente.html" class="nav-item"><span class="material-symbols-outlined">shopping_cart</span> Carrinho</a>
    </nav>

    <div class="sidebar-footer">
        <a href="#" class="nav-item" data-sair><span class="material-symbols-outlined">logout</span> Sair</a>
    </div>
    </aside>

    <div class="main-wrapper">
        <main class="container">

            <header class="hero">
                <h1>Aqui Estão todos os Produtos</h1>
                <p>Aqui estão todos os nosso produtos. Saboreie o nosso <span class="Sabor">SABOR</span></p>
            </header>

            <section class="filtros-fluxo-caixa">
                <div class="form-group-inline">
                    <label for="filtro-categoria">Categoria</label>
                    <select id="filtro-categoria" class="form-control" style="width: 200px;">
                        <option value="todos">Todos os Produtos</option>
                        <option value="pasteis-salgados">Pastéis Salgados</option>
                        <option value="pasteis-doces">Pastéis Doces</option>
                        <option value="panquecas-salgadas">Panquecas Salgadas</option>
                        <option value="panquecas-doces">Panquecas Doces</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>
                <div class="form-group-inline">
                    <label for="filtro-tipo">Tipo:</label>
                    <select id="filtro-tipo" class="form-control">
                        <option value="todos">Todos</option>
                        <option value="normal">Produtos normais</option>
                        <option value="promocional">Promocionais / Especiais</option>
                    </select>
                </div>
            </section>

            <section class="grid-produtos" id="lista-produtos">
                </section>
            <p id="mensagem-produto" role="status" aria-live="polite" class="ajuda-campo"></p>

            <footer class="card-footer">
                <p>© 2026 Delicias Da Lucy. Cardápio.</p>
            </footer>
        </main>
    </div>

    <template id="template-card-produto">
        <div class="product-card">
            <div class="produto-imagem-wrapper">
                <span class="badge-especial" hidden>PROMO / ESPECIAL</span>
                <img src="" alt="" class="img-vitrine">
            </div>
            <div class="product-info">
                <h3 class="titulo-vitrine"></h3>
                <p class="descricao-vitrine"></p>
                <p class="preco-vitrine"></p>

                <button type="button" class="btn btn-success btn-add-cart" style="width: 100%; gap: 8px; margin-bottom: 8px;">
                    <span class="material-symbols-outlined" style="font-size: 18px;">shopping_cart</span> Adicionar ao Carrinho
                </button>
            </div>
        </div>
    </template>



</body>
</html>
