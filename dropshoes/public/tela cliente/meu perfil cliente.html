<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias da Lucy | Meu Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../css/style.css">
    <script src="/vendor/sweetalert2.js"></script>
    <script type="module" src="../js/perfil.js" defer></script>
    <script type="module" src="../js/sessao.js" defer></script>
</head>
<body data-acesso="cliente" data-publica>

    <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="../tela cliente/principal.html" class="logo">Delicias<span> Da Lucy</span></a>
        <h2>Painel de Navegação</h2>
    </div>

     <nav class="sidebar-nav">
        <a href="../tela cliente/principal.html" class="nav-item"><span class="material-symbols-outlined">home</span> Início</a>
        <a href="../tela cliente/Produtos.html" class="nav-item"><span class="material-symbols-outlined">inventory_2</span> Cardápio</a>
        <a href="../tela cliente/meu perfil cliente.html" class="nav-item active"><span class="material-symbols-outlined">person</span> Meu Perfil</a>
        <a href="../tela cliente/carrino cliente.html" class="nav-item"><span class="material-symbols-outlined">shopping_cart</span> Carrinho</a>
    </nav>

    <div class="sidebar-footer">
        <a href="#" class="nav-item" data-sair><span class="material-symbols-outlined">logout</span> Sair</a>
    </div>
    </aside>

    <div class="main-wrapper">
        <main class="container">

            <header class="hero">
                <h1 id="boas-vindas-usuario">Esse é o seu perfil de Cliente do restaurante. </h1>

            </header>

            <section class="card-painel">
                <h2 class="card-title">Meus Dados Cadastrais</h2>
                <div class="grid-dados">
                    <div class="dado-grupo">
                        <label>Nome completo</label>
                        <p id="user-nome"></p>
                    </div>
                    <div class="dado-grupo">
                        <label>E-mail</label>
                        <p id="user-email"></p>
                    </div>
                    <div class="dado-grupo">
                        <label>Telefone</label>
                            <p id="user-fone"></p>
                    </div>
                </div>
            </section>

            <section id="painel-cliente-pedidos" class="card-painel panel-oculto">
                <h2 class="card-title">🛍️ Meu Histórico de Pedidos</h2>
                <div class="table-responsive">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th>Pedido</th>
                                <th>Data</th>
                                <th>Status</th>
                                <th class="text-right">Total</th>
                            </tr>
                        </thead>
                        <tbody id="meus-pedidos"></tbody>
                    </table>
                </div>
            </section>
            <div class="dado-grupo">
                <a class="btn btn-primary" href="../tela cliente/Produtos.html">Fazer novo pedido</a>
            </div>
        </main>
    </div>

</body>
</html>
