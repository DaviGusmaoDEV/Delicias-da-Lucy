<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias Da Lucy | Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="/vendor/sweetalert2.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="../js/login.js"></script>
</head>
<body class="login-page">

    <div class="login-container">
        <form id="form-login" data-acesso="admin" class="card-login">
            <a href="../tela de login/login cliente.html" class="logo">Delicias<span> Da Lucy</span></a>
            <h2>Acessar sua conta Administrativo</h2>

            <div class="form-group">
        <div class="input-with-icon">
            <span class="material-symbols-outlined">badge</span>
            <input type="email" id="email" autocomplete="email" placeholder="Seu e-mail" required>
        </div>
        </div>

            <div class="form-group">
        <div class="input-with-icon">
            <span class="material-symbols-outlined">lock</span>
            <input type="password" id="senha" autocomplete="current-password" required class="form-control" placeholder="Senha">
        </div>
        </div>

            <button type="submit" class="btn btn-primary">Entrar</button>

            <p class="login-footer">
                Acesso exclusivo para administradores já cadastrados.<br><a href="../tela de login/login cliente.html">Entrar como cliente</a>
            </p>
        </form>
    </div>

</body>
</html>
